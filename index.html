<!DOCTYPE html>
<html lang="pt-BR" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <script>
      window.$RefreshReg$ = window.$RefreshReg$ || function () {};
      window.$RefreshSig$ = window.$RefreshSig$ || function () { return function (type) { return type; }; };
      window.__vite_plugin_react_preamble_installed__ = true;
    </script>
    <!-- Proteção Imediata contra BFCache e Isolamento Estrito de Sessão por Aba (OWASP ASVS) -->
    <script>
      (function () {
        function checkAuthIntegrity() {
          try {
            // Isolamento rigoroso: sessões existem unicamente em sessionStorage por aba
            localStorage.removeItem('gx_client_user_v3');
            localStorage.removeItem('gx_admin_user_v3');
            localStorage.removeItem('gx_current_user_v3');

            // Purga estrita: geonimatos31@gmail.com é exclusivo do Administrador Geral e nunca conta de cliente
            var rawAccounts = localStorage.getItem('gx_accounts_v3');
            if (rawAccounts) {
              var accs = JSON.parse(rawAccounts);
              if (Array.isArray(accs)) {
                var changed = false;
                var adminList = ['geonimatos31@gmail.com'];
                for (var i = 0; i < accs.length; i++) {
                  var em = (accs[i].email || '').toLowerCase().trim();
                  if (adminList.indexOf(em) !== -1) {
                    if (accs[i].role !== 'admin') {
                      accs[i].role = 'admin';
                      changed = true;
                    }
                  }
                }
                if (changed) {
                  localStorage.setItem('gx_accounts_v3', JSON.stringify(accs));
                }
              }
            }

            var rawClients = localStorage.getItem('gx_clients_v3');
            if (rawClients) {
              var cls = JSON.parse(rawClients);
              if (Array.isArray(cls)) {
                var adminList = ['geonimatos31@gmail.com'];
                var filteredCls = cls.filter(function (c) {
                  var em = (c.email || '').toLowerCase().trim();
                  return adminList.indexOf(em) === -1;
                });
                if (filteredCls.length !== cls.length) {
                  localStorage.setItem('gx_clients_v3', JSON.stringify(filteredCls));
                }
              }
            }
          } catch (e) {}
          return true;
        }

        // Executa imediatamente na inicialização
        checkAuthIntegrity();

        // Intercepta restaurações de cache de memória (BFCache) em todos os navegadores
        window.addEventListener('pageshow', function (event) {
          if (event.persisted) {
            var clientSession = sessionStorage.getItem('gx_client_user_v3');
            var adminSession = sessionStorage.getItem('gx_admin_user_v3');
            if (!clientSession && !adminSession) {
              window.location.reload();
            }
          }
        });
      })();
    </script>
    <title>Global Exchange</title>
    <meta name="description" content="Plataforma de negociação e custódia Global Exchange (GX) da Engecema, com livro de ofertas, boletas de compra e venda, depósitos via Pix BB e painel administrativo." />
    <meta property="og:title" content="Global Exchange" />
