<!DOCTYPE html>
<html lang="pt-BR" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <script>
      window.$RefreshReg$ = window.$RefreshReg$ || function () {};
      window.$RefreshSig$ = window.$RefreshSig$ || function () { return function (type) { return type; }; };
      window.__vite_plugin_react_preamble_installed__ = true;
    </script>
    <!-- Cabeçalhos de Proteção Rígida contra Cache e BFCache (OWASP ASVS / Anti-Caching) -->
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta http-equiv="Surrogate-Control" content="no-store" />

    <!-- Proteção Imediata contra BFCache e Route Guard Pré-Renderização -->
    <script>
      (function () {
        function checkAuthIntegrity() {
          try {
            var clientSession = sessionStorage.getItem('gx_client_user_v3');
            var adminSession = sessionStorage.getItem('gx_admin_user_v3');
            var adminFlag = sessionStorage.getItem('gx_admin_authenticated');
            var path = window.location.pathname.toLowerCase();
            var hash = window.location.hash.toLowerCase();
            var search = window.location.search.toLowerCase();
            var isProtectedAdmin = path.indexOf('/admin') === 0 || path.indexOf('/configuracoes') === 0 || path.indexOf('/painel') === 0 || hash.indexOf('admin') !== -1 || search.indexOf('view=admin') !== -1;
            var isProtectedClient = path.indexOf('/cliente') === 0 || path.indexOf('/custodia') === 0 || hash.indexOf('cliente') !== -1;

            if (isProtectedAdmin) {
              var hasValidAdmin = adminFlag === 'true' && adminSession;
              if (!hasValidAdmin && adminSession) {
                try {
                  var parsed = JSON.parse(adminSession);
                  if (parsed && (parsed.role === 'admin' || parsed.email)) {
                    hasValidAdmin = true;
                    sessionStorage.setItem('gx_admin_authenticated', 'true');
                  }
                } catch (e) {}
              }

              if (!hasValidAdmin) {
                if (document.documentElement) {
                  document.documentElement.style.display = 'none';
                }
                sessionStorage.clear();
                localStorage.clear();
                window.location.replace('login.html');
                return false;
              }
            }

            if (isProtectedClient && !clientSession) {
              if (document.documentElement) {
                document.documentElement.style.display = 'none';
              }
              sessionStorage.clear();
              localStorage.clear();
              window.location.replace('login.html');
              return false;
            }
          } catch (e) {}
          return true;
        }

        // Executa imediatamente na compilação do DOM
        checkAuthIntegrity();

        // Intercepta restaurações de cache de memória (BFCache) em todos os navegadores
        window.addEventListener('pageshow', function (event) {
          if (event.persisted) {
            checkAuthIntegrity();
          }
        });
      })();
    </script>
    <title>Global Exchange</title>
    <meta name="description" content="Plataforma de negociação e custódia Global Exchange (GX) da Engecema, com livro de ofertas, boletas de compra e venda, depósitos via Pix BB e painel administrativo." />
    <meta property="og:title" content="Global Exchange" />
    <meta property="og:description" content="Plataforma de negociação e custódia Global Exchange (GX) da Engecema, com livro de ofertas, boletas de compra e venda, depósitos via Pix BB e painel administrativo." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body class="bg-[#0b0e11] text-[#eaecef] min-h-screen antialiased selection:bg-[#f0b90b] selection:text-black notranslate" translate="no">
    <div id="root" class="notranslate" translate="no"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
