<!DOCTYPE html>
<html lang="pt-BR" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <script>
      window.$RefreshReg$ = window.$RefreshReg$ || function () {};
      window.$RefreshSig$ = window.$RefreshSig$ || function () { return function (type) { return type; }; };
      window.__vite_plugin_react_preamble_installed__ = true;
    </script>
    <!-- Proteção Imediata contra BFCache e Recarregamento Pós-Logout (OWASP Anti-Caching & Lifecycle Security) -->
    <script>
      (function () {
        function checkAuthIntegrity() {
          try {
            var clientSession = sessionStorage.getItem('gx_client_user_v3') || localStorage.getItem('gx_client_user_v3');
            var adminSession = sessionStorage.getItem('gx_admin_user_v3') || localStorage.getItem('gx_admin_user_v3');
            var path = window.location.pathname.toLowerCase();
            var isProtectedPath = path.indexOf('/admin') === 0 || path.indexOf('/cliente') === 0 || path.indexOf('/custodia') === 0 || path.indexOf('/painel') === 0;

            if (isProtectedPath && !clientSession && !adminSession) {
              if (document.documentElement) {
                document.documentElement.style.display = 'none';
              }
              window.location.replace('/');
              return false;
            }
          } catch (e) {}
          return true;
        }

        // Executa imediatamente na compilação do DOM
        checkAuthIntegrity();

        // Intercepta restaurações de cache de memória (BFCache) em todos os navegadores
        window.addEventListener('pageshow', function (event) {
          if (event.persisted) {
            var clientSession = sessionStorage.getItem('gx_client_user_v3') || localStorage.getItem('gx_client_user_v3');
            var adminSession = sessionStorage.getItem('gx_admin_user_v3') || localStorage.getItem('gx_admin_user_v3');
            if (!clientSession && !adminSession) {
              if (document.documentElement) {
                document.documentElement.style.display = 'none';
              }
              window.location.replace(window.location.pathname);
            }
          }
        });
      })();
    </script>
    <title>Global Exchange</title>
    <meta name="description" content="Plataforma de negociação e custódia Global Exchange (GX) da Engecema, com livro de ofertas, boletas de compra e venda, depósitos via Pix BB e painel administrativo." />
    <meta property="og:title" content="Global Exchange" />
    <meta property="og:description" content="Plataforma de negociação e custódia Global Exchange (GX) da Engecema, com livro de ofertas, boletas de compra e venda, depósitos via Pix BB e painel administrativo." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body class="bg-[#0b0e11] text-[#eaecef] min-h-screen antialiased selection:bg-[#f0b90b] selection:text-black notranslate" translate="no">
    <div id="root" class="notranslate" translate="no"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
