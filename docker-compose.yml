version: "3.8"
services:
  redis-cache:
    image: redis:7-alpine
    container_name: global_exchange_redis
    ports:
      - "6379:6379"
  matching-engine:
    build: ./apps/matching-engine
    container_name: matching-engine
    ports:
      - "8081:8081"
  api-gateway:
    build: ./apps/api-gateway
    ports:
      - "3000:3000"
    depends_on:
      - redis-cache
