services:
  - type: web
    name: global-exchange
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Variáveis para Banco do Brasil (Preencher no painel do Render se for usar mTLS oficial)
