services:
  - type: web
    name: global-exchange
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GX_ADMIN_EMAILS
        value: geoni@globalexchange.com
