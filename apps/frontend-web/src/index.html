<!DOCTYPE html><html lang='pt-BR'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Global Exchange - Trading Platform</title><script src='https://tailwindcss.com'></script><link rel='icon' type='image/png' href='favicon.png'></head><body class='bg-slate-950 text-slate-100 font-sans'><header class='border-b border-slate-900 bg-slate-950/80 backdrop-blur sticky top-0 z-50'><div class='max-w-7xl mx-auto px-4 h-16 flex items-center justify-between'><div class='flex items-center gap-3'><span class='font-bold text-xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-orange-500'>Global Exchange</span></div><div class='text-xs font-semibold'><span class='text-slate-500'>Gateway:</span> <span id='g-status' class='text-emerald-400 font-bold'>connected</span></div></div></header><main class='max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8'><section id='order-book' class='bg-slate-900 border border-slate-800 rounded-xl p-4'><h2 class='text-lg font-bold mb-4 tracking-wide text-slate-200'>Livro de Ofertas (Order Book)</h2><div class='space-y-4'><div id='asks' class='space-y-1'><div class='grid grid-cols-3 text-xs font-semibold text-slate-500 pb-1 border-b border-slate-800'><span>Preço (USDT)</span><span class='text-right'>Quantidade</span><span class='text-right'>Total</span></div><div class='grid grid-cols-3 text-sm text-red-400 font-mono hover:bg-slate-800/50 py-0.5'><span>100.50</span><span class='text-right text-slate-300'>1.2500</span><span class='text-right text-slate-400'>125.62</span></div></div><div class='py-2 border-y border-slate-800 text-center'><span id='price-btxc' class='text-xl font-bold font-mono text-emerald-400'>3.50</span></div><div id='bids' class='space-y-1'><div class='grid grid-cols-3 text-sm text-emerald-400 font-mono hover:bg-slate-800/50 py-0.5'><span>99.75</span><span class='text-right text-slate-300'>1.5000</span><span class='text-right text-slate-400'>149.62</span></div></div></div></section><section id='order-form' class='bg-slate-900 border border-slate-800 rounded-xl p-4'><h2 class='text-lg font-bold mb-4 tracking-wide text-slate-200'>Formulário de Boletas (GX)</h2><div class='flex gap-2 mb-4'><button id='btn-side-buy' class='flex-1 py-2 font-bold text-center rounded-lg bg-emerald-500 text-slate-950 transition'>COMPRA</button><button id='btn-side-sell' class='flex-1 py-2 font-bold text-center rounded-lg bg-slate-800 text-slate-400 transition'>VENDA</button></div><div class='space-y-3 text-sm'><label class='block text-slate-400'>Preço (USDT)</label><input type='text' id='order-price' value='100.00' class='w-full bg-slate-950 border border-slate-800 rounded-lg p-2 font-mono text-slate-200'><label class='block text-slate-400'>Quantidade</label><input type='text' id='order-amount' placeholder='0.0000' class='w-full bg-slate-950 border border-slate-800 rounded-lg p-2 font-mono text-slate-200'><button id='btn-send-order' class='w-full py-3 mt-2 font-bold bg-amber-500 text-slate-950 rounded-lg hover:bg-amber-400 shadow-lg shadow-amber-500/10 transition'>Enviar Ordem GX</button></div></section><section id='wallet-dashboard' class='bg-slate-900 border border-slate-800 rounded-xl p-4'><h2 class='text-lg font-bold mb-4 tracking-wide text-slate-200'>Painel de Custódia</h2><div class='space-y-3'><div class='flex justify-between items-center bg-slate-950 p-3 border border-slate-800/60 rounded-lg'><div><span class='block text-xs font-semibold text-slate-500'>Saldo Disponível</span><span id='g-balance' class='text-lg font-bold font-mono text-slate-200'>1000.00</span></div><span class='text-xs font-bold px-2 py-1 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20'>GX</span></div><div class='border-t border-slate-800/60 pt-3'><label class='block text-xs font-semibold text-slate-500 mb-1'>Simular Depósito Pix BB:</label><input type='number' id='deposit-inp' placeholder='Valor em R\$' class='w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-sm font-mono text-slate-200 mb-2'><button class='w-full py-2 mb-2 font-bold bg-amber-500 text-slate-950 rounded-lg text-xs hover:bg-amber-400 transition' onclick='deposit()'>Gerar QR Code Pix</button><button class='w-full py-2 font-bold bg-orange-500 text-slate-950 rounded-lg text-xs hover:bg-orange-400 transition' id='btn-send-deposit'>Enviar Depósito</button></div><div id='pix-area' style='display:none;' class='mt-2 bg-slate-950 p-2 rounded border border-slate-800'><p class='text-[10px] text-slate-500'>Código Pix:</p><p id='pix-code-text' class='text-[10px] text-emerald-400 break-all font-mono'></p></div><div class='border-t border-slate-800/60 pt-3'><h3 class='text-xs font-bold text-slate-400 mb-2'>Histórico de Transações</h3><div class='text-xs space-y-1' id='hist-rows'></div></div><div class="border-t border-slate-800/60 pt-3"><label class="block text-xs font-semibold text-slate-500 mb-1">Simular Depósito Pix BB:</label><input type="number" id="deposit-inp" placeholder="Valor em R$" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-sm font-mono text-slate-200 mb-2"><button class="w-full py-2 mb-2 font-bold bg-amber-500 text-slate-950 rounded-lg text-xs hover:bg-amber-400 transition" onclick="deposit()">Gerar QR Code Pix</button><button class="w-full py-2 font-bold bg-orange-500 text-slate-950 rounded-lg text-xs hover:bg-orange-400 transition" id="btn-send-deposit" onclick="deposit()">Enviar Depósito</button></div><div id="pix-area" style="display:none;" class="mt-2 bg-slate-950 p-2 rounded border border-slate-800"><p class="text-[10px] text-slate-500">Código Pix:</p><p id="pix-code-text" class="text-[10px] text-emerald-400 break-all font-mono"></p></div><div class="border-t border-slate-800/60 pt-3"><h3 class="text-xs font-bold text-slate-400 mb-2">Histórico de Transações</h3><div class="text-xs space-y-1" id="hist-rows"></div></div></div></section></main><script src='app.js'></script></body></html>
